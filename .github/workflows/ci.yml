name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - run: cargo +stable fmt --check
      - run: cargo +stable test --locked
      - run: cargo +stable build --release --locked
  linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m unittest discover -s server
          for file in server/install.sh server/setup-oracle.sh server/rectangle-session server/rectangle-proton server/entrypoint server/agent-entrypoint; do
            sh -n "$file" || exit 1
          done

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rectangle · Disposable session</title>
<style>
  * { box-sizing: border-box; }
  body { background: #0d121a; color: #e1e9f0; font: 16px system-ui, sans-serif; margin: 0; }
  main { width: min(650px, 88%); margin: 10vh auto; }
  .mark { display: inline-block; width: 33px; height: 21px; border: 3px solid #6ce1ba; border-radius: 3px; }
  .kicker { color: #6ce1ba; letter-spacing: .17em; font-size: .75rem; margin: 1.5rem 0 .5rem; }
  h1 { font-size: clamp(2.1rem, 6vw, 3.6rem); margin: 0 0 1rem; letter-spacing: -.05em; }
  p { color: #a5b5c2; line-height: 1.55; }
  [hidden] { display: none; }
  label { display: block; margin: 1.5rem 0 .45rem; }
  input { width: 100%; padding: .9rem; border: 1px solid #526473; background: #18232e; color: #e1e9f0; border-radius: .4rem; font: inherit; }
  details { margin-top: 1.5rem; }
  a { color: #6ce1ba; text-underline-offset: .18em; }
  summary { cursor: pointer; color: #6ce1ba; }
</style>
<main>
  <span class="mark" aria-hidden="true"></span>
  <p class="kicker">RECTANGLE / REMOTE SESSION</p>
  <h1>A fresh browser session.</h1>
  <p id="network">OpenVPN is not configured. This tab has no internet connection.</p>
  <label for="typing">Keyboard test</label>
  <input id="typing" placeholder="Type a few words" autocomplete="off">
  <details><summary>What gets saved?</summary><p>This session uses temporary storage. Text clipboard sharing is available; files aren’t shared.</p></details>
</main>
<script>
  const status = document.getElementById('network');
  if (location.hash === '#vpn') {
    status.textContent = 'This tab uses its own OpenVPN container. Public HTTPS is available once the tunnel connects.';
  } else if (location.hash === '#cloud') {
    status.textContent = 'This browser runs on your cloud VM. Public HTTPS uses the VM’s internet connection.';
  } else if (location.hash === '#proton') {
    status.textContent = 'This tab uses the shared Proton VPN tunnel. Internet access stops if the tunnel drops.';
  } else if (location.hash === '#proton-unavailable') {
    status.textContent = 'The Proton VPN gateway is unavailable. This tab is offline.';
  } else if (location.hash === '#offline') {
    status.textContent = 'Offline mode is enabled. This tab has no internet connection.';
  }
</script>

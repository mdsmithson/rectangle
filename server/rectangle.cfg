// Rectangle's packaged AutoConfig. The Firefox content sandbox remains enabled.
(() => {
  const services = Services;
  const base = "/tmp/rectangle-navigation/";
  let window = null;
  let previous = "";
  let pending = false;
  services.obs.addObserver(subject => {
    if (window && !window.closed) return;
    window = subject;
    const io = subject.IOUtils;
    const timer = subject.setInterval(async () => {
      if (pending || subject.closed) return;
      pending = true;
      try {
        const browser = subject.gBrowser;
        const command = base + "command";
        if (await io.exists(command)) {
          const text = await io.readUTF8(command, { maxBytes: 8192 });
          await io.remove(command);
          const request = JSON.parse(text);
          if (request.action === "back") browser.goBack(false);
          if (request.action === "forward") browser.goForward(false);
          if (request.action === "reload") browser.selectedBrowser.reload();
          if (request.action === "navigate" && typeof request.url === "string") {
            const uri = services.io.newURI(request.url);
            if (uri.schemeIs("http") || uri.schemeIs("https")) {
              browser.selectedBrowser.loadURI(uri, {
                triggeringPrincipal: services.scriptSecurityManager.createNullPrincipal({}),
              });
              browser.selectedBrowser.focus();
            }
          }
        }
        const uri = browser.selectedBrowser.currentURI;
        const url = uri.schemeIs("https") || uri.schemeIs("http") ? uri.spec : "";
        const back = browser.canGoBackIgnoringUserInteraction ?? browser.selectedBrowser.webNavigation.canGoBack;
        const forward = browser.selectedBrowser.webNavigation.canGoForward;
        const status = `${Number(back)}${Number(forward)} ${url.length <= 4096 ? url : ""}\n`;
        if (status !== previous) {
          await io.writeUTF8(base + "state", status, { tmpPath: base + "state.tmp" });
          previous = status;
        }
      } catch (error) {
        Cu.reportError(error);
      } finally {
        pending = false;
      }
    }, 120);
    subject.addEventListener("unload", () => subject.clearInterval(timer), { once: true });
  }, "browser-delayed-startup-finished");
})();

[package]
name = "rectangle"
version = "0.1.33"
edition = "2024"
license = "Apache-2.0"
description = "A desktop client for browser and terminal sessions on your own Linux server"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
ron = "=0.12.3"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "persistence", "wgpu"] }
getrandom = "=0.3.4"
flate2 = "=1.1.10"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
url = "=2.5.8"

[build-dependencies]
flate2 = "=1.1.10"

[target.'cfg(windows)'.dependencies]
pollster = "=1.0.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Media_Audio", "Win32_UI_Controls_Dialogs"] }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "=0.18.2"
objc2 = "=0.6.5"

[profile.release]
lto = "thin"
strip = true
